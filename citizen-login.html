<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Login - CaseBridge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">CaseBridge</div>

        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>


    <main>

        <div class="login-container">

            <div class="login-box">

                <h1>Citizen Login</h1>

                <p class="login-subtitle">
                    Login to access your CaseBridge account
                </p>


                <form onsubmit="loginCitizen(event)">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >


                    <button type="submit">
                        Login
                    </button>

                </form>


                <p class="register-text">
                    Don't have an account?
                    <a href="#">Create Account</a>
                </p>

            </div>

        </div>

    </main>


    <footer>
        <p>© 2026 CaseBridge | College Project</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
