<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Registration - CaseBridge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">CaseBridge</div>

        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>


    <main>

        <div class="login-container">

            <div class="login-box">

                <h1>Create Account</h1>

                <p class="login-subtitle">
                    Register as a CaseBridge citizen
                </p>


                <form onsubmit="registerCitizen(event)">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >


                    <button type="submit">
                        Create Account
                    </button>

                </form>


                <p class="register-text">
                    Already have an account?
                    <a href="citizen-login.html">Login</a>
                </p>

            </div>

        </div>

    </main>


    <footer>
        <p>© 2026 CaseBridge | College Project</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>

</html>
